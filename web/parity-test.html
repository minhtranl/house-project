<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model parity test</title>
<link rel="stylesheet" href="style.css">
<style>
  .verdict {
    margin: 18px 0;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 700;
  }
  .verdict.pass { background: #0f7a36; color: #fff; }
  .verdict.fail { background: #c62828; color: #fff; }
  .verdict.busy { background: var(--panel-border); color: var(--text); }
  pre {
    overflow-x: auto;
    padding: 12px;
    border-radius: 6px;
    background: var(--gauge-bg);
    font-size: 12.5px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<main class="page">

  <header class="page-header">
    <h1>Model parity test</h1>
    <p class="subtitle">web/model.js checked against IndoorCO2-steady_state.py</p>
  </header>

  <section class="panel">
    <h2 class="panel-title">Result</h2>
    <div class="verdict busy" id="verdict">Running&hellip;</div>
    <pre id="detail"></pre>
    <p class="hint">
      Cases come from <code>web/parity-cases.json</code>, generated by
      <code>tools/generate_parity_cases.py</code>. Regenerate them whenever the
      Python model changes, then reload this page.
    </p>
  </section>

</main>

<script src="model.js"></script>
<script>
(function () {
  "use strict";

  // Floating-point tolerance: both languages do the same IEEE-754
  // arithmetic, so agreement should be near-exact.
  var TOLERANCE = 1e-9;

  var verdict = document.getElementById("verdict");
  var detail = document.getElementById("detail");

  function close(a, b) {
    return Math.abs(a - b) <= TOLERANCE * Math.max(1, Math.abs(a), Math.abs(b));
  }

  function run(cases) {
    var failures = [];

    cases.forEach(function (testCase, index) {
      var output = window.Co2Model.calculateSteadyStateCo2(testCase.input);
      var band = window.Co2Model.getEn16798Category(
        output.steadyStateCo2,
        testCase.input.outdoorCo2
      );

      var expected = testCase.expected;

      var mismatches = [];

      ["volume", "airflow", "totalGeneration", "steadyStateCo2"].forEach(
        function (field) {
          if (!close(output[field], expected[field])) {
            mismatches.push(
              field + ": js=" + output[field] + " py=" + expected[field]
            );
          }
        }
      );

      if (band.category !== expected.category) {
        mismatches.push(
          "category: js=" + band.category + " py=" + expected.category
        );
      }

      if (band.description !== expected.description) {
        mismatches.push(
          "description: js=" + band.description + " py=" + expected.description
        );
      }

      if (mismatches.length) {
        failures.push(
          "case " + index + "  " + JSON.stringify(testCase.input) +
          "\n    " + mismatches.join("\n    ")
        );
      }
    });

    if (failures.length === 0) {
      verdict.className = "verdict pass";
      verdict.textContent =
        "PASS — all " + cases.length + " cases match the Python model.";
      detail.textContent = "";
      return;
    }

    verdict.className = "verdict fail";
    verdict.textContent =
      "FAIL — " + failures.length + " of " + cases.length +
      " cases differ.";
    detail.textContent = failures.slice(0, 40).join("\n\n");
  }

  fetch("parity-cases.json")
    .then(function (response) {
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      return response.json();
    })
    .then(run)
    .catch(function (error) {
      verdict.className = "verdict fail";
      verdict.textContent = "Could not load parity-cases.json";
      detail.textContent =
        error.message +
        "\n\nThis page must be opened over http://, not as a file:// path." +
        "\nRun a local server from the project root, for example:" +
        "\n    python -m http.server 8000" +
        "\nthen open http://localhost:8000/web/parity-test.html";
    });
})();
</script>
</body>
</html>
